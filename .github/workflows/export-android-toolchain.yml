name: Export Android Toolchain

on:
  push:
    branches: [chatgpt-android-toolchain]

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Prime AGP 8.13.2 cache with clean Android build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/seed/app/src/main/java/com/example/seed
          cat > /tmp/seed/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'seed'
          include ':app'
          EOF
          cat > /tmp/seed/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF
          cat > /tmp/seed/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.seed'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.seed'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > /tmp/seed/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" /></manifest>
          EOF
          /tmp/gradle-8.13/bin/gradle -p /tmp/seed clean assembleRelease --no-daemon --stacktrace

      - name: Package toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/toolchain/sdk/build-tools /tmp/toolchain/sdk/platforms /tmp/toolchain/sdk/platform-tools-parent /tmp/toolchain/gradle-home
          cp -a /tmp/gradle-8.13 /tmp/toolchain/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/toolchain/sdk/build-tools/
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/toolchain/sdk/platforms/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/toolchain/sdk/
          if [ -d "$ANDROID_HOME/licenses" ]; then cp -a "$ANDROID_HOME/licenses" /tmp/toolchain/sdk/; fi
          cp -a "$HOME/.gradle/caches" /tmp/toolchain/gradle-home/
          cp -a "$HOME/.gradle/native" /tmp/toolchain/gradle-home/ 2>/dev/null || true
          cp -a "$HOME/.gradle/notifications" /tmp/toolchain/gradle-home/ 2>/dev/null || true
          tar -C /tmp -czf /tmp/android-toolchain-gradle-8.13-sdk35.tgz toolchain
          ls -lh /tmp/android-toolchain-gradle-8.13-sdk35.tgz

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-gradle-8.13-sdk35
          path: /tmp/android-toolchain-gradle-8.13-sdk35.tgz
          compression-level: 0
          retention-days: 1
