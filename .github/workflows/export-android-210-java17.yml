name: Export Android Java 17

on:
  pull_request:
    branches:
      - main

jobs:
  export-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pack Java 17
        run: |
          parent="$(dirname "$JAVA_HOME")"
          base="$(basename "$JAVA_HOME")"
          tar -czf temurin-17-linux-x64.tgz -C "$parent" "$base"
      - uses: actions/upload-artifact@v4
        with:
          name: temurin-17-linux-x64
          path: temurin-17-linux-x64.tgz
          if-no-files-found: error
