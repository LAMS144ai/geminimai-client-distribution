name: Export DNIe BC Provider

on:
  push:
    branches: [chatgpt-android-toolchain]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download BC provider required by DNIeDroid 2.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o /tmp/bcprov-jdk15on-1.65.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk15on/1.65/bcprov-jdk15on-1.65.jar
          sha256sum /tmp/bcprov-jdk15on-1.65.jar
      - name: Upload dependency
        uses: actions/upload-artifact@v4
        with:
          name: dniedroid-bcprov-1.65
          path: /tmp/bcprov-jdk15on-1.65.jar
          compression-level: 0
          retention-days: 1
