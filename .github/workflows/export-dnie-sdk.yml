name: Export DNIe SDK

on:
  push:
    branches: [chatgpt-android-toolchain]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download official DNIe SDK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o /tmp/SDK_DNIeDroid_FNMT.zip https://www.dnielectronico.es/descargas/Apps/SDK_DNIeDroid_FNMT.zip
          mkdir -p /tmp/dnie-sdk
          unzip -q /tmp/SDK_DNIeDroid_FNMT.zip -d /tmp/dnie-sdk
          find /tmp/dnie-sdk -type f | sort
          AAR=$(find /tmp/dnie-sdk -type f -name 'dniedroid-release.aar' | head -1)
          test -n "$AAR"
          cp "$AAR" /tmp/dniedroid-release.aar
          jarsigner -verify -verbose /tmp/dniedroid-release.aar | tail -50
      - name: Upload official DNIe AAR
        uses: actions/upload-artifact@v4
        with:
          name: dniedroid-official-aar
          path: /tmp/dniedroid-release.aar
          compression-level: 0
          retention-days: 1
