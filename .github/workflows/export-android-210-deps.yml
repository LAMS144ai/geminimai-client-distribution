name: Export Android 2.1.0 dependencies

on:
  pull_request:
    branches:
      - main

jobs:
  export-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Resolve Google Play Services Location
        run: gradle -p android-210-deps resolveOfflineDeps --no-daemon
      - name: Pack Gradle dependency cache
        run: tar -czf android-210-gradle-deps.tgz -C "$HOME/.gradle/caches" modules-2
      - uses: actions/upload-artifact@v4
        with:
          name: android-210-gradle-deps
          path: android-210-gradle-deps.tgz
          if-no-files-found: error
